<div class="users-header">
    <!-- Bouton ajouter -->
    <button mat-flat-button color="primary" (click)="openAddUserDialog()">
        + Add User
    </button>

    <!-- Champ recherche -->
    <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search</mat-label>
        <input matInput placeholder="Search by name or email" [(ngModel)]="searchQuery" (input)="applyFilters()" />
    </mat-form-field>

    <!-- Filtrer par rôle -->
    <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filter by Role</mat-label>
        <mat-select [(ngModel)]="selectedRole" (selectionChange)="applyFilters()">
            <mat-option value="ALL">All</mat-option>
            <mat-option *ngFor="let role of roles" [value]="role">{{ role }}</mat-option>
        </mat-select>
    </mat-form-field>

    <!-- Bouton tri -->
    <button mat-flat-button class="sort-button" (click)="toggleSort()">
        Sort {{ sortDirection === 'asc' ? 'A-Z' : 'Z-A' }}
    </button>

    <!-- Compteur -->
    <span class="user-counter">
        Showing {{ currentPage * pageSize + 1 }}–
        {{ Math.min((currentPage + 1) * pageSize, filteredUsers.length) }}
        of {{ filteredUsers.length }} users
    </span>
</div>

<div class="users-container">
    <mat-card *ngFor="let user of pagedUsers" class="user-card">
        <div class="user-card-content">
            <div class="user-info">
                <img [src]="user.profilePicture" alt="Avatar" class="avatar" />
                <div class="user-texts">
                    <h3 class="user-name">{{ user.fullName }}</h3>
                    <p class="user-email">{{ user.email }}</p>
                </div>
            </div>
            <div class="user-role">
                <mat-form-field appearance="outline" class="role-field">
                    <mat-label>Role</mat-label>
                    <mat-select [value]="user.role" (selectionChange)="onRoleChange(user.id, $event.value)">
                        <mat-option *ngFor="let role of roles" [value]="role">{{ role }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
    </mat-card>

    <!-- Pagination -->
    <mat-paginator
            [length]="filteredUsers.length"
            [pageSize]="pageSize"
            [pageSizeOptions]="[5, 10, 15]"
            (page)="onPageChange($event)">
    </mat-paginator>
</div>

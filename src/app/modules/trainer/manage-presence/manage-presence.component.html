<mat-card class="mp-card mp-centered">

    <!-- Mode switch -->
    <div class="mp-mode">
        <button mat-stroked-button [color]="mode()==='today' ? 'primary' : undefined" (click)="setMode('today')">
            <mat-icon>today</mat-icon>&nbsp;Today
        </button>
        <button mat-stroked-button [color]="mode()==='history' ? 'primary' : undefined" (click)="setMode('history')">
            <mat-icon>history</mat-icon>&nbsp;History
        </button>
    </div>

    <!-- History filters -->
    <div class="mp-row" *ngIf="mode()==='history'">
        <div class="mp-date-range">
            <label>
                From
                <input type="date" [(ngModel)]="historyStart">
            </label>
            <label>
                To
                <input type="date" [(ngModel)]="historyEnd">
            </label>
            <button mat-flat-button color="primary" (click)="load()">
                <mat-icon>search</mat-icon>&nbsp;Search
            </button>
        </div>
    </div>

    <!-- Class then Session -->
    <div class="mp-row">
        <mat-form-field appearance="outline" class="mp-select">
            <mat-label>Class</mat-label>
            <mat-select [(ngModel)]="selectedGroupId" (selectionChange)="onGroupChange()">
                <mat-option *ngFor="let g of groups" [value]="g.id">
                    {{ g.name }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="mp-select">
            <mat-label>Session</mat-label>
            <mat-select [(ngModel)]="selectedSessionId" (selectionChange)="onSelectSession()" [disabled]="!sessions.length">
                <mat-option *ngFor="let s of sessions; trackBy: trackBySession" [value]="s.id">
                    {{ sessionLabel(s) }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <div class="mp-actions" *ngIf="students.length">
            <button mat-button class="mp-link" (click)="setAll(true)">
                <mat-icon>check_circle</mat-icon>
                Mark all present
            </button>
            <button mat-button class="mp-link danger" (click)="setAll(false)">
                <mat-icon>cancel</mat-icon>
                Mark all absent
            </button>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="mp-toolbar" *ngIf="students.length">
        <mat-form-field appearance="outline" class="mp-search">
            <mat-label>Search student</mat-label>
            <input matInput [(ngModel)]="filter" placeholder="Name or email" />
        </mat-form-field>

        <button mat-flat-button color="primary" class="mp-save"
                (click)="save()"
                [disabled]="saving || !selectedSessionId || !students.length">
            <mat-icon>save</mat-icon>
            {{ saving ? 'Saving...' : 'Save' }}
        </button>
    </div>

    <!-- Students table -->
    <div class="mp-table" *ngIf="students.length">
        <div class="mp-head">
            <div>Student</div>
            <div>Email</div>
            <div class="text-center">Present</div>
        </div>

        <div class="mp-rowline" *ngFor="let s of filteredStudents(); trackBy: trackByStudent">
            <div>{{ s.fullName }}</div>
            <div class="muted">{{ s.email || '—' }}</div>
            <div class="center">
                <mat-slide-toggle color="primary"
                                  [checked]="(marks.get(s.id) ?? false)"
                                  (change)="toggle(s.id, $event.checked)">
                </mat-slide-toggle>
            </div>
        </div>

        <div class="mp-empty" *ngIf="filteredStudents().length === 0">
            No results for « {{ filter }} ».
        </div>
    </div>

    <div class="mp-empty" *ngIf="!loading && !sessions.length">
        No session found for the selected class.
    </div>

    <div class="mp-loading" *ngIf="loading">
        <mat-icon>hourglass_empty</mat-icon>
        Loading...
    </div>
</mat-card>

<mat-card class="mp-card mp-centered">  <!-- mp-centered = contenu centré -->

    <!-- Header: navigation semaine -->
    <div class="mp-header">
        <button mat-stroked-button class="mp-ghost" (click)="prevWeek()">
            <mat-icon>chevron_left</mat-icon>
            Précédente
        </button>

        <div class="mp-range mp-week-pill">
            Semaine du <strong>{{ monday() }}</strong> au <strong>{{ sunday() }}</strong>
        </div>

        <button mat-stroked-button class="mp-ghost" (click)="nextWeek()">
            Suivante
            <mat-icon>chevron_right</mat-icon>
        </button>
    </div>

    <!-- Sélecteur + actions -->
    <div class="mp-row">
        <mat-form-field appearance="outline" class="mp-select">
            <mat-label>Séance</mat-label>
            <mat-select [(ngModel)]="selectedSessionId" (selectionChange)="onSelectSession()">
                <mat-option *ngFor="let s of sessions; trackBy: trackBySession" [value]="s.id">
                    {{ sessionLabel(s) }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <div class="mp-actions" *ngIf="students.length">
            <button mat-button class="mp-link" (click)="setAll(true)">
                <mat-icon>check_circle</mat-icon>
                Tous présents
            </button>
            <button mat-button class="mp-link danger" (click)="setAll(false)">
                <mat-icon>cancel</mat-icon>
                Tous absents
            </button>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="mp-toolbar" *ngIf="students.length">
        <mat-form-field appearance="outline" class="mp-search">
            <mat-label>Rechercher un étudiant</mat-label>
            <input matInput [(ngModel)]="filter" placeholder="Nom ou email" />
        </mat-form-field>

        <button
                mat-flat-button
                color="primary"
                class="mp-save"
                (click)="save()"
                [disabled]="saving || !selectedSessionId || !students.length">
            <mat-icon>save</mat-icon>
            {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
    </div>

    <!-- Tableau -->
    <div class="mp-table" *ngIf="students.length">
        <div class="mp-head">
            <div>Étudiant</div>
            <div>Email</div>
            <div class="text-center">Présent</div>
        </div>

        <div class="mp-rowline" *ngFor="let s of filteredStudents(); trackBy: trackByStudent">
            <div>{{ s.fullName }}</div>
            <div class="muted">{{ s.email || '—' }}</div>
            <div class="center">
                <mat-slide-toggle color="primary"
                                  [checked]="(marks.get(s.id) ?? false)"
                                  (change)="toggle(s.id, $event.checked)">
                </mat-slide-toggle>
            </div>
        </div>

        <div class="mp-empty" *ngIf="filteredStudents().length === 0">
            Aucun résultat pour « {{ filter }} ».
        </div>
    </div>

    <div class="mp-empty" *ngIf="!loading && !sessions.length">
        Aucune séance pour cette semaine.
    </div>

    <div class="mp-loading" *ngIf="loading">
        <mat-icon>hourglass_empty</mat-icon>
        Chargement...
    </div>
</mat-card>

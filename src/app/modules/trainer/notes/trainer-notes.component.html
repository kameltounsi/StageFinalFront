<mat-card class="aa-card aa-centered">
    <div class="aa-filters" [formGroup]="form">
        <!-- Groupe -->
        <mat-form-field appearance="outline">
            <mat-label>Group</mat-label>
            <mat-select formControlName="groupeId" (selectionChange)="onGroupChanged($event.value)">
                <mat-option *ngFor="let g of groups" [value]="g.id">{{ g.nom }}</mat-option>
            </mat-select>
        </mat-form-field>

        <!-- Subject forcé depuis la spécialité du groupe -->
        <mat-form-field appearance="outline">
            <mat-label>Subject</mat-label>
            <mat-select formControlName="matiere" [disabled]="!subjects.length" (selectionChange)="loadSheet()">
                <mat-option *ngFor="let s of subjects" [value]="s">{{ s }}</mat-option>
            </mat-select>
        </mat-form-field>

        <!-- Pondération -->
        <div class="weights">
            <label class="weights-title">Weights:</label>
            <label><input type="radio" [formControl]="weightMode" value="40_60" /> CC 40% / Exam 60%</label>
            <label><input type="radio" [formControl]="weightMode" value="20_80" /> CC 20% / Exam 80%</label>
        </div>

        <span class="spacer"></span>

        <!-- NEW: open claims inbox dialog -->
        <button mat-stroked-button (click)="openClaimsInbox()">
            <mat-icon>inbox</mat-icon>&nbsp;Claims inbox
        </button>

        <button mat-flat-button color="primary" (click)="save()" [disabled]="saving() || !rows.length">
            <mat-icon>save</mat-icon>&nbsp;{{ saving() ? 'Saving…' : 'Save all' }}
        </button>
    </div>

    <div class="aa-table" *ngIf="rows.length; else empty">
        <div class="aa-head">
            <div>Student</div>
            <div class="num">CC (0–20)</div>
            <div class="num">Exam (0–20)</div>
            <div class="num">Average</div>
            <div>Comment</div>
        </div>

        <div class="aa-row" *ngFor="let row of rows.controls; let i = index; trackBy: trackByIndex" [formGroup]="row">
            <div>
                <div><strong>{{ row.value.studentName }}</strong></div>
                <div class="muted">{{ row.value.studentEmail }}</div>
            </div>

            <div class="num">
                <input
                        class="note-input"
                        type="number"
                        formControlName="cc"
                        step="0.25"
                        min="0"
                        max="20"
                        (blur)="onNoteBlur(row, 'cc')"
                />
            </div>

            <div class="num">
                <input
                        class="note-input"
                        type="number"
                        formControlName="examen"
                        step="0.25"
                        min="0"
                        max="20"
                        (blur)="onNoteBlur(row, 'examen')"
                />
            </div>

            <div class="num">
                <input class="note-input" type="number" formControlName="moyenne" readonly />
            </div>

            <div>
                <input class="comment-input" type="text" placeholder="Optional…" formControlName="commentaire" />
            </div>
        </div>
    </div>

    <ng-template #empty>
        <div class="aa-empty">
            {{ loading() ? 'Loading…' : 'Pick a group then choose a subject to load the sheet.' }}
        </div>
    </ng-template>
</mat-card>

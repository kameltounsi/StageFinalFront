<mat-card class="aa-card aa-centered" [formGroup]="form">

    <div class="aa-filters">
        <!-- Groupe -->
        <mat-form-field appearance="outline">
            <mat-label>Group</mat-label>
            <mat-select formControlName="groupeId" (selectionChange)="loadSheet()">
                <mat-option *ngFor="let g of groups" [value]="g.id">{{ g.nom }}</mat-option>
            </mat-select>
        </mat-form-field>

        <!-- Matière -->
        <mat-form-field appearance="outline">
            <mat-label>Subject</mat-label>
            <input matInput formControlName="matiere" (keyup.enter)="loadSheet()">
        </mat-form-field>

        <!-- Date -->
        <div class="aa-dates">
            <label>Date
                <input type="date" formControlName="date" (change)="loadSheet()">
            </label>
        </div>

        <span class="spacer"></span>

        <button mat-flat-button color="primary" (click)="save()" [disabled]="saving() || !rows.length">
            <mat-icon>save</mat-icon>&nbsp;{{ saving() ? 'Saving…' : 'Save all' }}
        </button>
    </div>

    <div class="aa-table" *ngIf="rows.length; else empty">
        <div class="aa-head">
            <div>Student</div>
            <div class="num">Note (0–20)</div>
            <div>Comment</div>
        </div>

        <!-- Use "let i = index" AND actually use i in trackBy to avoid 'unused constant i' -->
        <div class="aa-row"
             *ngFor="let row of rows.controls; let i = index; trackBy: trackByIndex"
             [formGroup]="row">
            <div>
                <div><strong>{{ row.controls.studentName.value }}</strong></div>
                <div class="muted">{{ row.controls.studentEmail.value }}</div>
            </div>

            <div class="num">
                <input class="note-input" type="number" formControlName="valeur" step="0.25" min="0" max="20">
            </div>

            <div>
                <input class="comment-input" type="text" placeholder="Optional…" formControlName="commentaire">
            </div>
        </div>
    </div>

    <ng-template #empty>
        <div class="aa-empty">
            {{ loading() ? 'Loading…' : 'Select a group, set subject & date, then the sheet will load.' }}
        </div>
    </ng-template>

</mat-card>

<div class="flex min-w-0 flex-auto flex-col items-center sm:flex-row sm:justify-center md:items-start md:justify-start">
    <div class="w-full px-4 py-8 sm:bg-card sm:w-auto sm:rounded-2xl sm:p-12 sm:shadow md:flex md:h-full md:w-1/2 md:items-center md:justify-end md:rounded-none md:p-16 md:shadow-none">
        <div class="mx-auto w-full max-w-80 sm:mx-0 sm:w-80">
            <div class="w-12">
                <img src="images/logo/logo.svg" />
            </div>

            <div class="mt-8 text-4xl font-extrabold leading-tight tracking-tight">
                Verify your code
            </div>
            <div class="mt-0.5 font-medium">
                Enter the 4-digit code sent to your email
            </div>

            <form class="mt-8" [formGroup]="verifyCodeForm" (ngSubmit)="verifyCode()">
                <mat-form-field class="w-full">
                    <mat-label>Reset Code</mat-label>
                    <input matInput formControlName="code" maxlength="4" />
                    <mat-error *ngIf="verifyCodeForm.get('code')?.hasError('required')">
                        Code is required
                    </mat-error>
                </mat-form-field>

                <button
                        class="fuse-mat-button-large mt-3 w-full"
                        mat-flat-button
                        [color]="'primary'"
                        [disabled]="verifyCodeForm.invalid"
                        type="submit">
                    <span>Verify</span>
                </button>
            </form>

            <div class="text-secondary mt-8 text-md font-medium">
                <span>Return to</span>
                <a class="ml-1 text-primary-500 hover:underline" [routerLink]="['/sign-in']">sign in</a>
            </div>
        </div>
    </div>

    <!-- Right side illustration -->
    <div class="relative hidden h-full w-1/2 flex-auto items-center justify-center overflow-hidden bg-gray-800 p-16 dark:border-l md:flex lg:px-28">
        <svg class="absolute inset-0 pointer-events-none" viewBox="0 0 960 540" width="100%" height="100%" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
            <g class="text-gray-700 opacity-25" fill="none" stroke="currentColor" stroke-width="100">
                <circle r="234" cx="196" cy="23"></circle>
                <circle r="234" cx="790" cy="491"></circle>
            </g>
        </svg>
        <svg class="absolute -top-16 -right-16 text-gray-700" viewBox="0 0 220 192" width="220" height="192" fill="none">
            <defs>
                <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect x="0" y="0" width="4" height="4" fill="currentColor"></rect>
                </pattern>
            </defs>
            <rect width="220" height="192" fill="url(#dots)"></rect>
        </svg>

        <div class="relative z-10 w-full max-w-2xl">
            <div class="text-7xl font-bold leading-none text-gray-100">
                <div>Welcome to</div>
                <div>our community</div>
            </div>
            <div class="mt-6 text-lg leading-6 tracking-tight text-gray-400">
                Fuse helps developers build clean, organized dashboards full of rich UI modules. Join us now!
            </div>
            <div class="mt-8 flex items-center">
                <div class="flex flex-0 items-center -space-x-1.5">
                    <img class="h-10 w-10 rounded-full object-cover ring-4 ring-gray-800 ring-offset-1 ring-offset-gray-800" src="images/avatars/female-18.jpg" />
                    <img class="h-10 w-10 rounded-full object-cover ring-4 ring-gray-800 ring-offset-1 ring-offset-gray-800" src="images/avatars/female-11.jpg" />
                    <img class="h-10 w-10 rounded-full object-cover ring-4 ring-gray-800 ring-offset-1 ring-offset-gray-800" src="images/avatars/male-09.jpg" />
                    <img class="h-10 w-10 rounded-full object-cover ring-4 ring-gray-800 ring-offset-1 ring-offset-gray-800" src="images/avatars/male-16.jpg" />
                </div>
                <div class="ml-4 font-medium tracking-tight text-gray-400">
                    More than 17k people joined us, it's your turn
                </div>
            </div>
        </div>
    </div>
</div>
